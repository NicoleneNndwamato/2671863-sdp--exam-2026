# Build from the repo root so npm workspaces resolve; publish the web build.
[build]
  command = "npm ci && npm run build -w @sdp/web"
  publish = "packages/web/dist"

[build.environment]
  NODE_VERSION = "20"

# Same-origin proxy to the Northflank API: avoids CORS entirely.
# Replace the placeholder host with your deployed API.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-API.onnorthflank.app/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes survive a refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
