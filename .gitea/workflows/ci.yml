name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Commit package-lock.json before relying on this.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with coverage
        run: npm run coverage --verbose

      - name: Upload API coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage-report
          path: packages/api/coverage
          retention-days: 14

      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: packages/web/coverage
          retention-days: 14

      # When the integration tests need a database, add a service container:
